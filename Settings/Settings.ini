; ============================================================================
; Settings.ini  控制面板 v1.2.0（亮色系主题 · 左侧导航 8 分页 · 现代控件）
;
; 导航与分页：1背景 2样式 3标记 4农历 5备忘 6缩放 7封面 8高级
;
; 控件体系（与 Settings.lua 配合）：
;   开关：     <键名>Box / <键名>Thumb          → Toggle('<键名>')
;   滑块：     Slt<键名>Hit/Fill/Knob/Value     → SliderSet / SliderJump / SliderStep
;   分段选择： WeekFmt0/1、CoverSeg1..5、LunarMode0..2
;   缩略图：   BgCell/BgThumb/BgBd 0..12 + BgBadge → SetBg(0-12)
;   标记行：   SpecDate<N>Label/Box/Text/Input/Color（N=行号1-12，分页器映射槽位）
;   备忘行：   Memo<N>Label/DateBox/DateText/DateInput/TextBox/TextText/TextInput
;   颜色块：   RainRGB4 直接写键                → 无需 Lua
; ============================================================================

[Rainmeter]
Update=-1
AccurateText=1

[Metadata]
Name=Settings
Author=小城子
Information=皮肤设置页面（亮色主题）
Version=1.2.0

[Variables]
FontMain=思源黑体
ColorText=42,33,58
ColorSub=122,112,136
ColorGold=176,138,74
ColorGoldLight=227,203,165
ColorInput=255,255,255
ColorBorder=221,213,200
ColorTrack=221,213,200
ColorHint=185,176,160
@include1=#@#Configs\Variables.inc
@include2=#@#Configs\Memos.inc

