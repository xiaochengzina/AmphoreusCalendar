; ============================================================================
; AmphoreusCalendar  翁法罗斯年历 · 主皮肤
;
; 文件结构：
;   AmphoreusCalendar.ini        本文件（皮肤骨架）
;   @Resources\Configs\Variables.inc     用户设置（控制面板自动写入）
;   @Resources\Configs\Default.inc       出厂默认设置（恢复默认用）
;   @Resources\Configs\CalendarGrid.inc  日历网格（42格，公式定位）
;   @Resources\Scripts\Common.lua        共享工具模块
;   @Resources\Scripts\Calendar.lua      日历主逻辑
;   Settings\Settings.ini                控制面板
;
; 注意：@include 的位置决定了日历网格 meter 的渲染层级
;       （必须位于背景之上、封面之下），请勿随意移动 [Variables] 段。
; ============================================================================

[Rainmeter]
Update=1000
AccurateText=1
ContextTitle=打开控制面板
ContextAction=[!ActivateConfig "AmphoreusCalendar\Settings" "Settings.ini"]

[Metadata]
Name=AmphoreusCalendar
Author=小城子
Information=崩铁翁法罗斯一年历桌面版 | 右键皮肤 → 打开控制面板
Version=1.2.0
License=CC BY-NC-SA 4.0

; ----------------------------- 圆角容器与背景 -----------------------------

[RoundedContainer]
Meter=Shape
Shape=Rectangle 0,0,[Background:W],[Background:H],#BgRoundedSize# | StrokeWidth 0
AntiAlias=1
DynamicVariables=1

[Background]
Meter=Image
ImageName=
W=(375 * #Scale#)
H=(812 * #Scale#)
AntiAlias=1
Container=RoundedContainer
DynamicVariables=1

; ----------------------------- 月份水印 -----------------------------

[GridHoverArea]
Meter=Shape
Shape=Rectangle 0,0,(295 * #Scale#),(165 * #Scale#) | StrokeWidth 0 | Fill Color 0,0,0,1
X=(40 * #Scale#)
Y=(585 * #Scale#)
AntiAlias=1
MouseOverAction=[!CommandMeasure "Script" "HoverLunarView()"]
MouseLeaveAction=[!CommandMeasure "Script" "HoverNormalView()"]
Container=RoundedContainer
DynamicVariables=1

[MonthMark]
Meter=String
Text=
FontFace=#FontMonthMark#
FontSize=(100 * #Scale#)
FontColor=255,255,255,#MonthRecogColorAlpha#
FontWeight=900
AntiAlias=1
X=(187 * #Scale#)
Y=(693 * #Scale#)
StringAlign=CenterCenter
Container=RoundedContainer
DynamicVariables=1

; ----------------------------- 星期表头 -----------------------------

[WeekStyle]
FontFace=#FontMain#
W=(41 * #Scale#)
H=(26 * #Scale#)
FontSize=(9 * #Scale#)
FontColor=#WeekColor#
AntiAlias=1
StringAlign=CenterCenter
Container=RoundedContainer
DynamicVariables=1

[Week1]
Meter=String
MeterStyle=WeekStyle
Text=
X=(64 * #Scale#)
Y=(595 * #Scale#)

[Week2]
Meter=String
MeterStyle=WeekStyle
Text=
X=(105 * #Scale#)
Y=(595 * #Scale#)

[Week3]
Meter=String
MeterStyle=WeekStyle
Text=
X=(146 * #Scale#)
Y=(595 * #Scale#)

[Week4]
Meter=String
MeterStyle=WeekStyle
Text=
X=(187 * #Scale#)
Y=(595 * #Scale#)

[Week5]
Meter=String
MeterStyle=WeekStyle
Text=
X=(228 * #Scale#)
Y=(595 * #Scale#)

[Week6]
Meter=String
MeterStyle=WeekStyle
Text=
X=(269 * #Scale#)
Y=(595 * #Scale#)

[Week7]
Meter=String
MeterStyle=WeekStyle
Text=
X=(310 * #Scale#)
Y=(595 * #Scale#)

; ----------------------------- 变量与包含文件 -----------------------------
; @include2 会把日历网格 meter 插入到本段之后（即背景之上、封面之下）

[Variables]
; 内部常量（用户设置请前往控制面板，不要改这里）
FontMain=思源黑体
FontMonthMark=獅尾圓體SC
FontCover=Rouge Script
; 日历行距：由 Calendar.lua 按当月行数动态设置（4行=36 5行=27 6行=22）
GridRowGap=22
; 网格区域淡入淡出 alpha（0-255，由 ViewFadeTimer 驱动）
ViewAlpha=255
U=[!UpdateMeter *][!Redraw]

@include1=#@#Configs\Variables.inc
@include2=#@#Configs\CalendarGrid.inc

; ----------------------------- 封面 -----------------------------

[CalendarCoverImage]
Meter=Image
ImageName=#@#Images\0.jpg
W=(375 * #Scale#)
H=(812 * #Scale#)
AntiAlias=1
Container=RoundedContainer
Group=CalendarCover
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure "Script" "CalendarCoverClick()"]
Hidden=1

[CalendarCoverText1]
Meter=String
Text=
FontFace=#FontCover#
FontSize=(35 * #Scale#)
FontColor=#CalendarCoverTextColor#
FontWeight=900
AntiAlias=1
X=(40 * #Scale#)
Y=(512 * #Scale#)
Container=RoundedContainer
Group=CalendarCover
DynamicVariables=1
Hidden=1

[CalendarCoverText2]
Meter=String
Text=
FontFace=#FontCover#
FontSize=(35 * #Scale#)
FontColor=#CalendarCoverTextColor#
FontWeight=900
AntiAlias=1
X=(52 * #Scale#)
Y=(538 * #Scale#)
Container=RoundedContainer
Group=CalendarCover
DynamicVariables=1
Hidden=1

; ----------------------------- 脚本 -----------------------------

; 网格区域淡入淡出计时器（SetView 触发：淡出 8 步 → 交换内容 → 淡入 8 步）
[ViewFadeTimer]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat FadeOut, 16, 8 | SwapView | Repeat FadeIn, 16, 8 | Done
Done=[!CommandMeasure "Script" "TransitionDone()"]
FadeOut=[!SetVariable ViewAlpha "(Clamp((#ViewAlpha#-34),0,255))"]#U#
SwapView=[!CommandMeasure "Script" "ApplyPendingView()"]
FadeIn=[!SetVariable ViewAlpha "(Clamp((#ViewAlpha#+34),0,255))"]#U#
DynamicVariables=1

[Script]
Measure=Script
ScriptFile=#@#Scripts\Calendar.lua
UpdateDivider=1
